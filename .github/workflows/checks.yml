name: Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check CLI syntax
        run: node --check bin/groundwork.mjs
      - name: Check report helper syntax
        run: node --check skills/audit-report-authoring/scripts/lint-report-set.mjs
      - name: Verify npm CLI entry point
        run: npm exec --offline --yes --package=. -- groundwork --help
      - name: Inspect package contents
        run: npm pack --dry-run
