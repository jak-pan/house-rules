# Installed by House Rules kits/rust-local-build; remove with its uninstall script.
# Shared local compiler cache; keep Cargo targets isolated per worktree/agent.
[build]
rustc-wrapper = "@HELPER_DIR@/kache-rustc"
# Build budget: the cargo queue (@WRAPPER_DIR@/cargo) sets CARGO_BUILD_JOBS and RUST_TEST_THREADS from
# performance cores - 2, or from @STATE_DIR@/build-budget-override. This value is the fallback for a cargo
# started without the queue.
jobs = @JOBS@
# Parallel front end: at opt-level 0 it cut an edit rebuild roughly in half (11.2 s + 25.3 s instead of
# 29.2 s + 57.3 s on Symbiotic Memory). It does not raise the core count: its extra threads come from the
# same job pool, so jobs caps the total. Changing the value changes every crate's fingerprint (full rebuild).
rustflags = ["-Zthreads=@ZTHREADS@"]

[env]
# C/C++ compiles in build scripts go through the same cache.
CC = "@HELPER_DIR@/kache-cc"
CXX = "@HELPER_DIR@/kache-c++"
ZERO_AR_DATE = "1"

# Local builds only (CI and shipped binaries keep their own settings): one pinned nightly (the queue forces
# @TOOLCHAIN@), LLVM at opt-level 0, trim-paths. Cranelift was as fast but cannot unwind panics on macOS
# (rust-lang/rustc_codegen_cranelift#1567), so every panicking test aborted its test binary.
[unstable]
trim-paths = true

[profile.release]
incremental = true
opt-level = 0
trim-paths = "all"

# No debug builds unless debugging: a plain `cargo build`/`cargo test` gets the release settings.
# Debug on purpose: `--profile debugging`.
[profile.dev]
opt-level = 0
debug = false
debug-assertions = false
overflow-checks = false
incremental = true
trim-paths = "all"

[profile.debugging]
inherits = "dev"
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
